[project]
name = "ledmatrixmanager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rgbmatrixemulator>=0.20.0",
    "rgbmatrix @ git+https://github.com/hzeller/rpi-rgb-led-matrix ; sys_platform == 'linux' and platform_machine in 'aarch64 armv7l armv6l'",
]

[project.scripts]
ledmatrixmanager = "ledmatrixmanager:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"